<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#1b1d21">Snort en DMZ · diagrama reconstruido a partir del informe</text>
  <rect x="20" y="140" width="170" height="90" rx="8" fill="#f0f0ec" stroke="#8a8f98"/>
  <text x="105" y="178" text-anchor="middle" font-weight="700" fill="#1b1d21">Red externa</text>
  <text x="105" y="200" text-anchor="middle" fill="#565b64">Adaptador puente · DHCP</text>
  <rect x="300" y="110" width="250" height="150" rx="8" fill="#e2eff2" stroke="#0b5d74" stroke-width="2"/>
  <text x="425" y="140" text-anchor="middle" font-weight="700" fill="#08465a">IDS · Ubuntu Server</text>
  <text x="425" y="165" text-anchor="middle" fill="#1b1d21">Snort (escucha en enp0s8)</text>
  <text x="425" y="187" text-anchor="middle" fill="#1b1d21">ip_forward=1 · iptables NAT</text>
  <text x="425" y="209" text-anchor="middle" fill="#1b1d21">MASQUERADE + FORWARD</text>
  <text x="425" y="240" text-anchor="middle" fill="#565b64">enp0s3 (ext.) · enp0s8 192.168.100.1</text>
  <line x1="190" y1="185" x2="298" y2="185" stroke="#555" stroke-width="2"/>
  <text x="244" y="175" text-anchor="middle" fill="#565b64" font-size="12">enp0s3</text>
  <rect x="640" y="60" width="240" height="300" rx="8" fill="none" stroke="#c2410c" stroke-dasharray="6 4"/>
  <text x="760" y="85" text-anchor="middle" font-weight="700" fill="#c2410c">Red interna 192.168.100.0/24</text>
  <rect x="660" y="105" width="200" height="105" rx="8" fill="#f0f0ec" stroke="#8a8f98"/>
  <text x="760" y="130" text-anchor="middle" font-weight="700" fill="#1b1d21">WebServer (DMZ)</text>
  <text x="760" y="152" text-anchor="middle" fill="#1b1d21">192.168.100.10</text>
  <text x="760" y="174" text-anchor="middle" fill="#565b64">Apache · MySQL · SSH</text>
  <text x="760" y="194" text-anchor="middle" fill="#565b64">phpMyAdmin</text>
  <rect x="660" y="235" width="200" height="105" rx="8" fill="#f0f0ec" stroke="#8a8f98"/>
  <text x="760" y="262" text-anchor="middle" font-weight="700" fill="#1b1d21">SOC · Ubuntu Desktop</text>
  <text x="760" y="284" text-anchor="middle" fill="#1b1d21">192.168.100.20</text>
  <text x="760" y="306" text-anchor="middle" fill="#565b64">genera tráfico de prueba</text>
  <text x="760" y="326" text-anchor="middle" fill="#565b64">(ping, SSH, HTTP)</text>
  <line x1="550" y1="185" x2="638" y2="185" stroke="#555" stroke-width="2"/>
  <text x="594" y="175" text-anchor="middle" fill="#565b64" font-size="12">enp0s8</text>
  <text x="20" y="380" fill="#565b64" font-size="12">Nota: según el informe, la máquina SOC está en la misma red interna que el WebServer, no en la red externa.</text>
</svg>

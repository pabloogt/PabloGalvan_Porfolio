  <text x="470" y="255" fill="#1b1d21" font-size="13">zona_origen (calculado), tipo_evento</text>
  <text x="20" y="310" fill="#565b64" font-size="12">Versiones y puertos según el informe original. Kibana se publicó en el puerto 81 porque el 80 estaba ocupado.</text>

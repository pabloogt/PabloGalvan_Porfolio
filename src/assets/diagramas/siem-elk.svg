  <text x="95" y="122" text-anchor="middle" font-weight="700" fill="#1b1d21">Kali Linux</text>
  <text x="95" y="145" text-anchor="middle" fill="#565b64">ping · ssh · curl</text>
  <rect x="215" y="70" width="190" height="120" rx="8" fill="#e2eff2" stroke="#0b5d74" stroke-width="2"/>
  <text x="310" y="98" text-anchor="middle" font-weight="700" fill="#08465a">Agente IDS (DMZ1)</text>
  <text x="310" y="122" text-anchor="middle" fill="#1b1d21">Snort · local.rules</text>
  <text x="310" y="144" text-anchor="middle" fill="#1b1d21">snort.alert.fast</text>
  <text x="310" y="168" text-anchor="middle" fill="#1b1d21">Filebeat 6.5.4</text>
  <rect x="455" y="55" width="425" height="215" rx="8" fill="none" stroke="#c2410c" stroke-dasharray="6 4"/>
  <text x="668" y="78" text-anchor="middle" font-weight="700" fill="#c2410c">Servidor SIEM 192.168.100.15</text>
  <rect x="470" y="95" width="125" height="90" rx="8" fill="#f0f0ec" stroke="#8a8f98"/>
  <text x="532" y="125" text-anchor="middle" font-weight="700" fill="#1b1d21">Logstash</text>
  <text x="532" y="147" text-anchor="middle" fill="#565b64">beats :5044</text>
  <text x="532" y="167" text-anchor="middle" fill="#565b64">grok + mutate</text>
  <rect x="610" y="95" width="125" height="90" rx="8" fill="#f0f0ec" stroke="#8a8f98"/>
  <text x="672" y="125" text-anchor="middle" font-weight="700" fill="#1b1d21">Elasticsearch</text>
  <text x="672" y="147" text-anchor="middle" fill="#565b64">:9200</text>
  <text x="672" y="167" text-anchor="middle" fill="#565b64">índice logstash</text>

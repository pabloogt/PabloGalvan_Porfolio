<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="900" height="330" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#444"/></marker></defs>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#1b1d21">SIEM ELK · flujo de eventos (diagrama reconstruido)</text>

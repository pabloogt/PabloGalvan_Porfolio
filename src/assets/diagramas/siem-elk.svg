  <text x="807" y="125" text-anchor="middle" font-weight="700" fill="#1b1d21">Kibana</text>
  <text x="807" y="147" text-anchor="middle" fill="#565b64">:81</text>
  <text x="807" y="167" text-anchor="middle" fill="#565b64">dashboard</text>
  <line x1="170" y1="130" x2="212" y2="130" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="405" y1="130" x2="467" y2="130" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="595" y1="140" x2="607" y2="140" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="735" y1="140" x2="747" y2="140" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="215" fill="#1b1d21" font-size="13">Campos extraídos: fecha_y_hora, maquina, sid, alerta, protocolo,</text>
